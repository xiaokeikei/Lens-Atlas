name: Android read-only client
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'frontend/**', 'tests/test_android_readonly.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'frontend/**', 'tests/test_android_readonly.py', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build:mobile
      - run: mkdir -p android/app/src/main/assets && cp -R frontend/dist-mobile/. android/app/src/main/assets/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          # sdkmanager can finish before yes; do not treat yes's SIGPIPE as a failure.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - working-directory: android
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: LensAtlas-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
