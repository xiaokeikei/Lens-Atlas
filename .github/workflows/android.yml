name: Android read-only client
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'frontend/**', 'tests/test_android_readonly.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'frontend/**', 'tests/test_android_readonly.py', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build:mobile
      - run: mkdir -p android/app/src/main/assets && cp -R frontend/dist-mobile/. android/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - working-directory: android
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LensAtlas-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
