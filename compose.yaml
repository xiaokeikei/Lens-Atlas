name: lens-atlas
services:
  lens-atlas:
    build: .
    image: lens-atlas:0.1.8
    platform: linux/amd64
    init: true
    restart: unless-stopped
    user: "${LENS_UID:-1000}:${LENS_GID:-1000}"
    ports:
      # Listen on all host interfaces so NAS IP changes do not prevent startup.
      - "${LENS_BIND_IP:-0.0.0.0}:${LENS_PORT:-52032}:52032"
    environment:
      LENS_DATA_DIR: /data
      LENS_MEDIA_ROOTS: /media
    volumes:
      - type: bind
        source: ${LENS_MEDIA_PATH:?Set LENS_MEDIA_PATH in .env}
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LENS_APP_PATH:?Set LENS_APP_PATH in .env}
        target: /data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s
