[project]
name = "lens-atlas"
version = "0.1.8"
description = "Read-only photography library analysis"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pillow>=11,<13", "httpx>=0.28,<1"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7", "pyinstaller>=6.10,<7"]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

